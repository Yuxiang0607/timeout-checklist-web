<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>OR Timeout Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- 字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ====== 全局設定 ====== */
    body {
      font-family: 'Noto Sans', 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8fafc, #eef3f7);
      margin: 0;
      padding: 40px 24px;
      color: #2c3e50;
      font-size: 20px;
      line-height: 1.6;
    }

    /* ====== 卡片 ====== */
    .card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e3e8ee;
      padding: 28px 32px;
      margin: 26px auto;
      max-width: 900px;
      transition: all 0.2s ease;
    }

    /* ====== 標題 ====== */
    h2 {
      margin: 0 0 18px 0;
      font-weight: 600;
      font-size: 1.6em;
      color: #1e293b;
      border-left: 6px solid #0077b6;
      padding-left: 14px;
      letter-spacing: 0.5px;
    }

    /* ====== 每句項目 ====== */
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9fbfd;
      border-radius: 12px;
      padding: 18px 20px;
      margin: 12px 0;
      font-size: 1.1em;
      transition: background 0.25s ease;
    }

    .item:hover {
      background: #eef4f8;
    }

    /* ====== 狀態燈號 ====== */
    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e74c3c;
      box-shadow: 0 0 8px rgba(231, 76, 60, 0.6);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot.ok {
      background: #2ecc71;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.8);
      transform: scale(1.1);
    }

    /* ====== 按鈕（高級配色） ====== */
    .row {
      display: flex;
      gap: 16px;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease-in-out;
      font-family: "Poppins", "Segoe UI", "Noto Sans TC", sans-serif;
    }

    /* 主按鈕：深藍漸層 + 微光影 */
    button.primary {
      color: #fff;
      background: linear-gradient(135deg, #1f3b74, #2c5596); /* 深 → 淺藍 */
      box-shadow: 0 6px 14px rgba(31, 59, 116, 0.28);
      border: 1px solid rgba(255,255,255,0.08);
    }
    button.primary:hover {
      background: linear-gradient(135deg, #25448a, #3463ad);
      box-shadow: 0 10px 18px rgba(31, 59, 116, 0.34);
      transform: translateY(-1px);
    }
    button.primary:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 4px 10px rgba(31, 59, 116, 0.22);
    }
    button.primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 次按鈕：絲絨銀灰 */
    button.secondary {
      color: #2d3748;
      background: linear-gradient(135deg, #eff3f7, #e2e7ee);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.06);
    }
    button.secondary:hover {
      background: linear-gradient(135deg, #e7ecf2, #dbe2ea);
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.10);
    }
    button.secondary:active {
      transform: translateY(1px) scale(0.99);
    }
    button.secondary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }

    small {
      color: #6b7280;
    }

    /* ====== 日誌區 ====== */
    .log {
      white-space: pre-wrap;
      background: #0a0a0a;
      color: #d6ffd6;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      max-height: 220px;
      overflow: auto;
      margin-top: 12px;
    }

    a {
      color: #1f3b74;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }

    /* ====== 進度條 ====== */
    #progressBarContainer {
      margin-top: 12px;
      height: 12px;
      border-radius: 10px;
      background: #e0e6eb;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5fb0ff, #1f3b74); /* 與主色系一致 */
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    #progressText {
      margin-top: 8px;
      font-size: 16px;
      text-align: right;
      color: #475569;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Audio Controls</h2>
    <div class="row">
      <button id="btnStart" class="primary">🎙️ Start</button>
      <button id="btnStop" class="secondary" disabled>⏹️ Stop</button>
      <button id="btnReset" class="secondary">🔄 Reset Lights</button>
      <a id="dl" style="display:none" target="_blank">Download transcript</a>
    </div>
    <small>Recording format: WebM (Opus). Your API key stays on the server.</small>
    <div id="progressBarContainer">
      <div id="progressBar"></div>
    </div>
    <div id="progressText">0 / 0 Completed</div>
    <div id="status" class="log"></div>
  </div>

  <div class="card" id="checklist"></div>

<script>
const BACKEND_BASE = "https://timeout-checklist-server.onrender.com";

// ====== Checklist groups ======
const GROUPS = [
  ["Timeout Initiation", [
    "Is everyone ready to begin the timeout?",
    "Do we have the consent form in front of us?"
  ]],
  ["Team Introduction", [
    "Please introduce yourselves.",
    "Is the attending physician present?",
    "Who is the anesthesia attending?",
    "What are the names and roles of the other team members?"
  ]],
  ["Patient Identification", [
    "What is your full name?",
    "What is your date of birth?",
    "What is your Medical Record Number?"
  ]],
  ["Surgical Consent Verification", [
    "Is the consent form signed?",
    "What surgery and/or block is being performed?",
    "Which side?",
    "Is it marked?"
  ]],
  ["Local Anesthetic Plan", [
    "Which local anesthetic will be used?",
    "What is the intended concentration?",
    "What is the intended volume?"
  ]],
  ["Patient Medical Considerations", [
    "Are you currently taking any anticoagulants?",
    "Do you have any clotting disorders?",
    "Do you have any known drug allergies?",
    "Do you have a history of systemic neuropathy and/or neuropathy at the surgical site?"
  ]],
  ["Monitoring System Check", [
    "Is NIBP monitoring ready?",
    "Is ECG monitoring ready?",
    "Is SpO₂ ready?",
    "Is EtCO₂ monitoring ready?"
  ]],
  ["Additional Concerns", [
    "Does anyone have any other question or concern?"
  ]],
  ["Timeout Completion", [
    "Timeout completed."
  ]]
];

const checklistEl = document.getElementById("checklist");
const dotMap = new Map();
const statusEl = document.getElementById("status");
const dlEl = document.getElementById("dl");

// 錄音相關狀態
let mediaRecorder = null;
let isRecording = false;
let stopRequested = false;
let pendingUploads = 0;

// 用來累積所有 chunk 的文字（客戶端產生 transcript）
let transcriptLines = [];

// ====== UI：Checklist 渲染 ======
function renderChecklist(){
  checklistEl.innerHTML = "";
  GROUPS.forEach(([title, items])=>{
    const group = document.createElement("div");
    group.className = "group";
    group.innerHTML = `<h2>${title}</h2>`;
    items.forEach(sent=>{
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `<div>${sent}</div><div class="dot" data-sent="${sent}" title="Click to toggle"></div>`;
      group.appendChild(row);
    });
    const card = document.createElement("div");
    card.className="card";
    card.appendChild(group);
    checklistEl.appendChild(card);
  });

  document.querySelectorAll(".dot").forEach(d=>{
    dotMap.set(d.dataset.sent, d);
    d.addEventListener('click', () => {
      d.classList.toggle('ok');
      updateProgress();
    });
  });

  updateProgress();
}
renderChecklist();

// ====== 進度條 ======
function updateProgress(){
  const total = dotMap.size;
  const done = [...dotMap.values()].filter(dot => dot.classList.contains('ok')).length;
  const percent = total ? (done / total) * 100 : 0;
  document.getElementById("progressBar").style.width = percent + "%";
  document.getElementById("progressText").textContent = `${done} / ${total} Completed`;
}

// ====== Reset Lights ======
function resetLights(){
  dotMap.forEach(dot=>dot.classList.remove("ok"));
  // 清除 transcript download
  if (dlEl.dataset.blobUrl){
    URL.revokeObjectURL(dlEl.dataset.blobUrl);
    delete dlEl.dataset.blobUrl;
  }
  dlEl.style.display="none";
  transcriptLines = [];
  updateProgress();
}
document.getElementById("btnReset").onclick = resetLights;

// ====== 日誌 ======
function log(s){
  statusEl.textContent = (statusEl.textContent + s + "\n").slice(-4000);
}

// ====== Start Recording（每 30 秒自動 chunk） ======
async function startRec(){
  try{
    // 停掉前一次還在播的 TTS
    try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch(e) {}

    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    transcriptLines = [];  // 新一輪錄音就重算 transcript
    mediaRecorder = new MediaRecorder(stream, {mimeType: "audio/webm"});
    isRecording = true;
    stopRequested = false;

    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0){
        // 每一段 chunk 立即上傳+比對+亮燈
        uploadChunk(e.data);
      }
    };

    mediaRecorder.onstop = () => {
      log("⏹️ Recording stopped.");
      // 不在這裡上傳，最後一段也會由 ondataavailable 觸發
      // speak 的時機交給 checkSpeakRemaining()
    };

    // 每 30 秒產生一個 chunk；最後 Stop 時會再出一個尾巴 chunk
    mediaRecorder.start(30000);
    log("🎙️ Recording started… (auto-chunk every 30s)");
    document.getElementById("btnStart").disabled = true;
    document.getElementById("btnStop").disabled = false;
  }catch(err){
    log("Microphone error: " + err);
  }
}
document.getElementById("btnStart").onclick = startRec;

// ====== Stop Recording（之後等待最後 chunks 上傳完） ======
function stopRec(){
  if (mediaRecorder && mediaRecorder.state !== "inactive"){
    stopRequested = true;
    isRecording = false;
    mediaRecorder.stop();
    document.getElementById("btnStop").disabled = true;
    document.getElementById("btnStart").disabled = false;
    log("⏹️ Stop requested, waiting for last chunks to finish…");
  }
}
document.getElementById("btnStop").onclick = stopRec;

// ====== 上傳單一 chunk 到 /transcribe-chunk ======
async function uploadChunk(blob){
  pendingUploads++;
  const kb = Math.round(blob.size / 1024);
  log(`⬆️ Uploading chunk (${kb} KB)…`);

  const fd = new FormData();
  // 後端參數名稱是 audio: UploadFile
  fd.append("audio", blob, "chunk.webm");

  try{
    const res = await fetch(`${BACKEND_BASE}/transcribe-chunk`, {
      method:"POST",
      body: fd
    });
    if (!res.ok){
      throw new Error(await res.text());
    }
    const data = await res.json();

    // 累積 raw 句子，給 transcript 用
    if (data.raw && data.raw.length){
      data.raw.forEach(line => {
        transcriptLines.push(line);
      });
      updateTranscriptDownload();
    }

    // 用 hits 來亮燈
    if (data.hits && data.hits.length){
      log("✅ Chunk hits:\n- " + data.hits.join("\n- "));
      data.hits.forEach(sent => {
        const dot = dotMap.get(sent);
        if (dot) dot.classList.add("ok");
      });
      updateProgress();
    }else{
      log("ℹ️ Chunk has no canonical hits.");
    }

    // 需要的話也可以顯示 suggestions
    if (data.suggestions && data.suggestions.length){
      data.suggestions.forEach(s => {
        log(`💡 Suggestion: "${s.raw}" → maybe "${s.best}" (score=${s.score})`);
      });
    }

  }catch(err){
    log("❌ Chunk upload/STT error: " + err);
  }finally{
    pendingUploads--;
    checkSpeakRemaining();
  }
}

// ====== 更新 transcript 下載連結（前端自己組 TXT） ======
function updateTranscriptDownload(){
  if (!transcriptLines.length){
    if (dlEl.dataset.blobUrl){
      URL.revokeObjectURL(dlEl.dataset.blobUrl);
      delete dlEl.dataset.blobUrl;
    }
    dlEl.style.display = "none";
    return;
  }
  const blob = new Blob([transcriptLines.join("\n") + "\n"], {type: "text/plain"});
  const url = URL.createObjectURL(blob);

  if (dlEl.dataset.blobUrl){
    URL.revokeObjectURL(dlEl.dataset.blobUrl);
  }
  dlEl.dataset.blobUrl = url;
  dlEl.href = url;
  dlEl.textContent = "Download transcript";
  dlEl.style.display = "inline-block";
}

// ====== Stop 後，上傳都跑完時，念出所有還是紅燈的句子 ======
function checkSpeakRemaining(){
  if (!stopRequested) return;
  if (pendingUploads > 0) return;  // 還有 chunk 在路上

  const remaining = [...dotMap.entries()]
    .filter(([, dot]) => !dot.classList.contains("ok"))
    .map(([sent]) => sent);

  if (remaining.length > 0){
    speakLinesOnce(remaining, { rate: 0.95, pitch: 1.0, gapMs: 450 });
  }
  // 避免重複觸發
  stopRequested = false;
}

/* ====== TTS：把未完成(紅燈)的句子念一遍 ====== */
function getEnglishVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  // 優先找英文女聲（找不到就用第一個英文）
  return voices.find(v => /en-US|en_GB/i.test(v.lang) && /Female|Google US English|Samantha|Jenny|Zira/i.test(v.name))
      || voices.find(v => /en/i.test(v.lang))
      || voices[0];
}

function speakLinesOnce(lines, {rate=1.0, pitch=1.0, gapMs=300} = {}) {
  if (!("speechSynthesis" in window)) return;

  const doSpeak = () => {
    const voice = getEnglishVoice();
    if (!voice) return;

    // 先取消前一次未講完的
    speechSynthesis.cancel();

    lines.forEach((text, i) => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice;
      u.rate = rate;
      u.pitch = pitch;
      u.volume = 1.0;
      setTimeout(() => speechSynthesis.speak(u), i * gapMs);
    });
  };

  // 有些瀏覽器第一次 getVoices() 會是空的，要等事件
  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.onvoiceschanged = () => {
      doSpeak();
      speechSynthesis.onvoiceschanged = null;
    };
  } else {
    doSpeak();
  }
}
</script>
</body>
</html>
